<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="جعبه هدیه زرشکی و عاجی رَواق | RAVĀQ">
  <defs>
    <!-- Studio Lighting & Architectural Plaster Backdrop -->
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4" />
      <stop offset="55%" stop-color="#F8F4EC" />
      <stop offset="100%" stop-color="#E7DDD0" />
    </linearGradient>
    <radialGradient id="sunlightGlow" cx="72%" cy="24%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#F8F4EC" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#E4DCCF" stop-opacity="0" />
    </radialGradient>
    <!-- Recessed Iranian Arch Niche -->
    <linearGradient id="archNiche" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAE0D2" />
      <stop offset="45%" stop-color="#F3EDE2" />
      <stop offset="100%" stop-color="#FCFAF6" />
    </linearGradient>
    <!-- Natural Walnut Wood Console Surface -->
    <linearGradient id="walnutSurface" x1="0%" y1="0%" x2="100%" y2="12%">
      <stop offset="0%" stop-color="#4A2F21" />
      <stop offset="35%" stop-color="#5D3B2A" />
      <stop offset="70%" stop-color="#4E3122" />
      <stop offset="100%" stop-color="#3B2318" />
    </linearGradient>
    <linearGradient id="walnutEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E1B12" />
      <stop offset="50%" stop-color="#462B1E" />
      <stop offset="100%" stop-color="#29170F" />
    </linearGradient>
    <!-- Burgundy #742E3A Rigid Box Materials -->
    <linearGradient id="burgundyFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#853543" />
      <stop offset="50%" stop-color="#742E3A" />
      <stop offset="100%" stop-color="#56202A" />
    </linearGradient>
    <linearGradient id="burgundySide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58212B" />
      <stop offset="100%" stop-color="#3B151D" />
    </linearGradient>
    <!-- Warm Ivory #F8F4EC Lid Materials -->
    <linearGradient id="ivoryLidTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF8" />
      <stop offset="60%" stop-color="#F8F4EC" />
      <stop offset="100%" stop-color="#E6DDD0" />
    </linearGradient>
    <linearGradient id="ivoryLidFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F4EC" />
      <stop offset="100%" stop-color="#E5DDD0" />
    </linearGradient>
    <linearGradient id="ivoryLidSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DED4C4" />
      <stop offset="100%" stop-color="#CBBFA9" />
    </linearGradient>
    <!-- Restrained Antique Brass #B89A62 -->
    <linearGradient id="antiqueBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEC593" />
      <stop offset="48%" stop-color="#B89A62" />
      <stop offset="100%" stop-color="#8B703E" />
    </linearGradient>
    <!-- Ambient Contact Shadow -->
    <radialGradient id="boxShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#190D09" stop-opacity="0.72" />
      <stop offset="62%" stop-color="#190D09" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#190D09" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Studio Wall & Golden-Hour Sunlight -->
  <rect width="800" height="600" fill="url(#wallBg)" />
  <rect width="800" height="600" fill="url(#sunlightGlow)" />
  <polygon points="470,0 800,0 800,435 280,435" fill="#EFE5D6" opacity="0.42" />

  <!-- 2. Recessed Iranian Architectural Arch Niche -->
  <path d="M210 435V185C210 88 295 22 400 22C505 22 590 88 590 185V435H210Z" fill="url(#archNiche)" stroke="#E4DCCF" stroke-width="2" />
  <path d="M232 435V192C232 106 307 44 400 44C493 44 568 106 568 192V435" fill="none" stroke="#B89A62" stroke-opacity="0.38" stroke-width="1.5" />
  <circle cx="400" cy="44" r="4" fill="#2D8C88" />

  <!-- 3. Natural Walnut Wood Console Table -->
  <polygon points="0,435 800,435 800,565 0,565" fill="url(#walnutSurface)" />
  <rect x="0" y="565" width="800" height="35" fill="url(#walnutEdge)" />
  <!-- Subtle Walnut Wood Grain Lines -->
  <path d="M0 468 Q 260 460 520 472 T 800 465" fill="none" stroke="#362015" stroke-width="1.4" opacity="0.45" />
  <path d="M0 512 Q 340 502 640 518 T 800 509" fill="none" stroke="#362015" stroke-width="1.2" opacity="0.4" />
  <line x1="0" y1="435" x2="800" y2="435" stroke="#B89A62" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- 4. Contact & Cast Shadow on Walnut Wood -->
  <ellipse cx="408" cy="482" rx="235" ry="34" fill="url(#boxShadow)" />

  <!-- 5. Signature 3D Perspective RAVĀQ Gift Box -->
  <g transform="translate(155, 148)">
    <!-- Lower Rigid Box: Front Left Face (#742E3A Burgundy) -->
    <polygon points="36,132 308,168 308,324 36,280" fill="url(#burgundyFront)" stroke="#B89A62" stroke-opacity="0.45" stroke-width="1.2" />
    <!-- Lower Rigid Box: Right Perspective Face (#4C202B Dark Wine) -->
    <polygon points="308,168 456,120 456,272 308,324" fill="url(#burgundySide)" stroke="#B89A62" stroke-opacity="0.35" stroke-width="1.2" />

    <!-- Restrained Antique Brass Neck Reveal Strip -->
    <polygon points="36,125 308,161 308,171 36,135" fill="url(#antiqueBrass)" />
    <polygon points="308,161 456,113 456,123 308,171" fill="#8B703E" />

    <!-- Warm Ivory Overhanging Lid: Top Plane (#F8F4EC) -->
    <polygon points="28,84 190,42 464,72 308,120" fill="url(#ivoryLidTop)" stroke="#B89A62" stroke-opacity="0.6" stroke-width="1.5" />
    <!-- Subtle Iranian Geometric Inset Line on Lid Top -->
    <polygon points="62,82 192,49 428,75 300,113" fill="none" stroke="#B89A62" stroke-opacity="0.45" stroke-width="1.2" />

    <!-- Warm Ivory Lid: Front Overhang Lip -->
    <polygon points="28,84 308,120 308,162 28,125" fill="url(#ivoryLidFront)" stroke="#B89A62" stroke-opacity="0.55" stroke-width="1.2" />
    <!-- Warm Ivory Lid: Right Perspective Overhang Lip -->
    <polygon points="308,120 464,72 464,114 308,162" fill="url(#ivoryLidSide)" stroke="#B89A62" stroke-opacity="0.45" stroke-width="1.2" />

    <!-- Silk Burgundy & Antique Brass Ribbon -->
    <polygon points="154,52 186,44 342,108 308,118" fill="#742E3A" />
    <polygon points="150,100 186,105 186,304 150,298" fill="url(#antiqueBrass)" opacity="0.92" />
    <polygon points="368,102 394,94 394,292 368,301" fill="#8B703E" opacity="0.8" />

    <!-- Sculpted Silk Bow on Lid Center -->
    <path d="M242 78C196 46 154 66 184 86C202 98 228 85 242 78Z" fill="#742E3A" stroke="#B89A62" stroke-width="1.5" />
    <path d="M242 78C288 46 330 66 300 86C282 98 256 85 242 78Z" fill="#4C202B" stroke="#B89A62" stroke-width="1.5" />
    <circle cx="242" cy="78" r="8" fill="url(#antiqueBrass)" />
    <circle cx="242" cy="78" r="3.5" fill="#2D8C88" />

    <!-- Warm Ivory Brand Plaque on Front Face with Exact RAVĀQ / رَواق Identity -->
    <g transform="translate(88, 166) skewY(7.5)">
      <rect x="0" y="0" width="164" height="86" rx="6" fill="#F8F4EC" stroke="url(#antiqueBrass)" stroke-width="2" />
      <rect x="6" y="6" width="152" height="74" rx="4" fill="none" stroke="#E4DCCF" stroke-width="1" />
      <!-- Muted Iranian Turquoise Keystone Dot -->
      <circle cx="82" cy="18" r="3.2" fill="#2D8C88" />
      <!-- Vector Calligraphic رَواق Wordmark -->
      <g transform="translate(38, 22) scale(1.02)">
        <path d="M79 6L71 10.5" stroke="#B89A62" stroke-width="2.4" stroke-linecap="round" />
        <path d="M78 14.5C78 21.5 73.5 27.5 65.5 30.5" stroke="#292624" stroke-width="3.2" stroke-linecap="round" fill="none" />
        <path d="M57 18.5C53.2 18.5 50.8 16.2 50.8 13.5C50.8 10.8 53.2 8.8 56.2 8.8C59.4 8.8 61.5 11.2 61.5 15.2C61.5 22.5 56.2 28.5 47.5 30.5" stroke="#292624" stroke-width="3" stroke-linecap="round" fill="none" />
        <path d="M41.5 6.5V26.5" stroke="#292624" stroke-width="3.2" stroke-linecap="round" />
        <path d="M27.5 17.5C24.2 17.5 22 15.5 22 12.8C22 10.2 24.2 8.4 27 8.4C30 8.4 32 10.6 32 14.8V21.5C32 27.2 26.8 31 18.5 31C11.2 31 7 27.4 7 21.8C7 19.2 7.8 17 9.2 15.5" stroke="#292624" stroke-width="3" stroke-linecap="round" fill="none" />
        <circle cx="24" cy="4.2" r="2" fill="#2D8C88" />
        <circle cx="29.5" cy="4.2" r="2" fill="#B89A62" />
      </g>
      <!-- Exact Latin Brand Spelling RAVĀQ -->
      <text x="82" y="71" text-anchor="middle" fill="#742E3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="3.5">RAVĀQ</text>
    </g>
  </g>
</svg>
