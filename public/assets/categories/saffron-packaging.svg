<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="بسته‌بندی زعفران و خوراکی‌های منتخب رَواق | RAVĀQ">
  <defs>
    <linearGradient id="saffronWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4" />
      <stop offset="55%" stop-color="#F8F4EC" />
      <stop offset="100%" stop-color="#E7DDD0" />
    </linearGradient>
    <linearGradient id="walnutBase" x1="0%" y1="0%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#4A2F21" />
      <stop offset="50%" stop-color="#5D3B2A" />
      <stop offset="100%" stop-color="#3B2318" />
    </linearGradient>
    <linearGradient id="velvetBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#843341" />
      <stop offset="55%" stop-color="#742E3A" />
      <stop offset="100%" stop-color="#4C202B" />
    </linearGradient>
    <linearGradient id="crimsonSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B81D2A" />
      <stop offset="50%" stop-color="#8F1420" />
      <stop offset="100%" stop-color="#5E0B14" />
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="30%" stop-color="#F8F4EC" stop-opacity="0.2" />
      <stop offset="75%" stop-color="#F8F4EC" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="brassAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0C896" />
      <stop offset="50%" stop-color="#B89A62" />
      <stop offset="100%" stop-color="#8A6E3B" />
    </linearGradient>
    <radialGradient id="saffronShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#190D09" stop-opacity="0.7" />
      <stop offset="65%" stop-color="#190D09" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#190D09" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Studio Wall & Arch Niche -->
  <rect width="800" height="600" fill="url(#saffronWall)" />
  <polygon points="460,0 800,0 800,430 270,430" fill="#EFE5D6" opacity="0.45" />
  <path d="M210 430V180C210 85 295 20 400 20C505 20 590 85 590 180V430H210Z" fill="#EFE5D6" fill-opacity="0.58" stroke="#E4DCCF" stroke-width="2" />
  <path d="M230 430V186C230 102 306 40 400 40C494 40 570 102 570 186V430" fill="none" stroke="#B89A62" stroke-opacity="0.38" stroke-width="1.5" />

  <!-- 2. Walnut Table Surface -->
  <rect x="0" y="430" width="800" height="140" fill="url(#walnutBase)" />
  <rect x="0" y="570" width="800" height="30" fill="#2A1810" />
  <line x1="0" y1="430" x2="800" y2="430" stroke="#B89A62" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- 3. Shadows -->
  <ellipse cx="275" cy="472" rx="145" ry="24" fill="url(#saffronShadow)" />
  <ellipse cx="485" cy="482" rx="125" ry="22" fill="url(#saffronShadow)" />
  <ellipse cx="625" cy="486" rx="68" ry="15" fill="url(#saffronShadow)" />

  <!-- 4. Left: Burgundy & Warm Ivory Presentation Box for Saffron -->
  <g transform="translate(145, 136)">
    <rect x="16" y="20" width="210" height="316" rx="10" fill="url(#velvetBurgundy)" stroke="url(#brassAccent)" stroke-width="2" />
    <rect x="28" y="32" width="186" height="292" rx="6" fill="none" stroke="#B89A62" stroke-opacity="0.45" stroke-width="1.2" />
    <!-- Warm Ivory Inner Plaque -->
    <rect x="44" y="76" width="154" height="168" rx="6" fill="#F8F4EC" stroke="url(#brassAccent)" stroke-width="1.8" />
    <path d="M88 122V106C88 92 102 82 121 82C140 82 154 92 154 106V122" fill="none" stroke="#B89A62" stroke-opacity="0.45" stroke-width="1.2" />
    <circle cx="121" cy="104" r="3.2" fill="#2D8C88" />
    <text x="121" y="156" text-anchor="middle" fill="#292624" font-family="sans-serif" font-size="26" font-weight="700">رَواق</text>
    <text x="121" y="182" text-anchor="middle" fill="#742E3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5">RAVĀQ</text>
    <line x1="74" y1="202" x2="168" y2="202" stroke="#E4DCCF" stroke-width="1.5" />
    <circle cx="121" cy="218" r="3" fill="#B81D2A" />
  </g>

  <!-- 5. Center-Right: Faceted Crystal Glass Apothecary Jar Filled with Crimson Iranian Saffron Threads -->
  <g transform="translate(405, 198)">
    <!-- Brushed Antique Brass Stepped Stopper & Lid -->
    <rect x="58" y="4" width="54" height="16" rx="5" fill="url(#brassAccent)" />
    <rect x="34" y="20" width="102" height="32" rx="6" fill="url(#brassAccent)" stroke="#8A6E3B" stroke-width="1.2" />
    <!-- Glass Neck -->
    <rect x="44" y="52" width="82" height="18" fill="url(#glassReflection)" stroke="#E4DCCF" stroke-width="1.2" />
    <!-- Faceted Crystal Jar Body -->
    <rect x="16" y="70" width="138" height="210" rx="18" fill="#FAF6EE" fill-opacity="0.78" stroke="#D5C8B4" stroke-width="2" />
    <!-- Dense Crimson Saffron Threads Inside Jar -->
    <rect x="24" y="96" width="122" height="174" rx="12" fill="url(#crimsonSaffron)" />
    <!-- Individual Saffron Thread Highlights Inside Jar -->
    <g stroke="#E84A35" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
      <path d="M38 118 Q62 106 84 124" fill="none" />
      <path d="M76 112 Q104 128 132 114" fill="none" />
      <path d="M42 142 Q78 130 112 148" fill="none" />
      <path d="M54 168 Q92 154 128 172" fill="none" />
      <path d="M36 196 Q74 212 118 192" fill="none" />
      <path d="M48 228 Q88 214 130 234" fill="none" />
      <path d="M40 250 Q82 240 120 254" fill="none" />
    </g>
    <!-- Warm Ivory Waist Band with RAVĀQ Seal -->
    <rect x="16" y="148" width="138" height="62" fill="#F8F4EC" stroke="url(#brassAccent)" stroke-width="1.8" />
    <circle cx="85" cy="161" r="2.5" fill="#2D8C88" />
    <text x="85" y="184" text-anchor="middle" fill="#292624" font-family="sans-serif" font-size="18" font-weight="700">رَواق</text>
    <text x="85" y="201" text-anchor="middle" fill="#742E3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" letter-spacing="3">RAVĀQ</text>
    <!-- Crystal Specular Highlight -->
    <rect x="24" y="76" width="14" height="196" rx="6" fill="url(#glassReflection)" />
  </g>

  <!-- 6. Right Foreground: Small Antique Brass Mortar & Loose Crimson Saffron Strands -->
  <g transform="translate(585, 360)">
    <!-- Pestle -->
    <line x1="58" y1="-22" x2="36" y2="42" stroke="url(#brassAccent)" stroke-width="10" stroke-linecap="round" />
    <!-- Brass Mortar Vessel -->
    <path d="M8 32 H76 L66 116 C64 124, 20 124, 18 116 Z" fill="url(#brassAccent)" stroke="#8A6E3B" stroke-width="1.5" />
    <ellipse cx="42" cy="32" rx="34" ry="8" fill="#8A6E3B" stroke="url(#brassAccent)" stroke-width="1.5" />
    <!-- Loose Crimson Saffron Threads on Walnut Surface -->
    <g stroke="#B81D2A" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M-22 122 Q-4 114 12 126" />
      <path d="M-14 130 Q6 124 22 132" />
      <path d="M-28 128 Q-10 136 4 128" />
    </g>
  </g>
</svg>
