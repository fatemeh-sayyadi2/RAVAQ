<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="پسته و خشکبار دست‌چین ایرانی رَواق | RAVĀQ">
  <defs>
    <linearGradient id="nutsWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4" />
      <stop offset="55%" stop-color="#F8F4EC" />
      <stop offset="100%" stop-color="#E7DDD0" />
    </linearGradient>
    <linearGradient id="walnutTable" x1="0%" y1="0%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#4B3022" />
      <stop offset="45%" stop-color="#5E3C2B" />
      <stop offset="100%" stop-color="#3C2419" />
    </linearGradient>
    <linearGradient id="canisterBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863644" />
      <stop offset="50%" stop-color="#742E3A" />
      <stop offset="100%" stop-color="#4C202B" />
    </linearGradient>
    <linearGradient id="brassLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC796" />
      <stop offset="50%" stop-color="#B89A62" />
      <stop offset="100%" stop-color="#896E3B" />
    </linearGradient>
    <linearGradient id="turquoiseBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#389E9A" />
      <stop offset="55%" stop-color="#2D8C88" />
      <stop offset="100%" stop-color="#1D5E5B" />
    </linearGradient>
    <radialGradient id="contactShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A0E09" stop-opacity="0.68" />
      <stop offset="65%" stop-color="#1A0E09" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#1A0E09" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Warm Ivory Plaster Backdrop & Sunlight -->
  <rect width="800" height="600" fill="url(#nutsWall)" />
  <polygon points="480,0 800,0 800,430 290,430" fill="#EFE5D6" opacity="0.45" />
  <path d="M210 430V180C210 85 295 20 400 20C505 20 590 85 590 180V430H210Z" fill="#EFE5D6" fill-opacity="0.55" stroke="#E4DCCF" stroke-width="2" />
  <path d="M230 430V186C230 102 306 40 400 40C494 40 570 102 570 186V430" fill="none" stroke="#B89A62" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- 2. Natural Walnut Wood Table -->
  <rect x="0" y="430" width="800" height="140" fill="url(#walnutTable)" />
  <rect x="0" y="570" width="800" height="30" fill="#2B1910" />
  <line x1="0" y1="430" x2="800" y2="430" stroke="#B89A62" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- 3. Contact Shadows -->
  <ellipse cx="290" cy="468" rx="135" ry="24" fill="url(#contactShadow)" />
  <ellipse cx="505" cy="485" rx="165" ry="26" fill="url(#contactShadow)" />

  <!-- 4. Left: Burgundy & Ivory RAVĀQ Gourmet Canister with Brushed Brass Lid -->
  <g transform="translate(185, 130)">
    <rect x="16" y="42" width="178" height="292" rx="22" fill="url(#canisterBurgundy)" stroke="#B89A62" stroke-opacity="0.55" stroke-width="1.5" />
    <!-- Brushed Antique Brass Lid -->
    <rect x="24" y="14" width="162" height="36" rx="9" fill="url(#brassLid)" stroke="#896E3B" stroke-width="1.2" />
    <rect x="82" y="2" width="46" height="14" rx="5" fill="url(#brassLid)" />
    <!-- Warm Ivory Label Plaque -->
    <rect x="34" y="96" width="142" height="146" rx="8" fill="#F8F4EC" stroke="url(#brassLid)" stroke-width="2" />
    <rect x="41" y="103" width="128" height="132" rx="5" fill="none" stroke="#E4DCCF" stroke-width="1" />
    <path d="M75 136V124C75 112 88 104 105 104C122 104 135 112 135 124V136" fill="none" stroke="#B89A62" stroke-opacity="0.45" stroke-width="1.2" />
    <circle cx="105" cy="122" r="3" fill="#2D8C88" />
    <text x="105" y="166" text-anchor="middle" fill="#292624" font-family="sans-serif" font-size="24" font-weight="700">رَواق</text>
    <text x="105" y="190" text-anchor="middle" fill="#742E3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="3.5">RAVĀQ</text>
    <line x1="62" y1="206" x2="148" y2="206" stroke="#E4DCCF" stroke-width="1.5" />
    <circle cx="105" cy="218" r="2.5" fill="#B89A62" />
  </g>

  <!-- 5. Right Foreground: Muted Turquoise (#2D8C88) Ceramic Bowl Filled with Iranian Pistachios & Dried Fruits -->
  <g transform="translate(365, 275)">
    <!-- Mound of Detailed Split Pistachios, Golden Apricots, Figs & Almonds Inside Bowl -->
    <!-- Dried Golden Apricots (برگه زردآلو) -->
    <ellipse cx="102" cy="88" rx="34" ry="22" transform="rotate(-14 102 88)" fill="#D9822B" stroke="#B56518" stroke-width="1.5" />
    <ellipse cx="188" cy="84" rx="32" ry="21" transform="rotate(18 188 84)" fill="#E08E36" stroke="#B56518" stroke-width="1.5" />
    <!-- Dried Figs (انجیر خشک) -->
    <circle cx="222" cy="98" r="23" fill="#C99E67" stroke="#8C673A" stroke-width="1.5" />
    <path d="M222 72 L226 80 L218 80 Z" fill="#8C673A" />
    <!-- Whole Almonds (بادام درختی) -->
    <ellipse cx="66" cy="102" rx="24" ry="13" transform="rotate(-25 66 102)" fill="#9E6236" stroke="#6E3F1D" stroke-width="1.2" />
    <ellipse cx="145" cy="76" rx="25" ry="14" transform="rotate(10 145 76)" fill="#A86B3E" stroke="#6E3F1D" stroke-width="1.2" />

    <!-- Detailed Iranian Smiling Pistachios (Ivory Shell + Emerald Green & Purple-blushed Kernel) -->
    <g transform="translate(76, 86) rotate(-12)">
      <ellipse cx="22" cy="16" rx="20" ry="12" fill="#5D8C42" />
      <path d="M4 16 C6 3, 38 3, 40 14 C28 11, 14 11, 4 16 Z" fill="#F4EAD5" stroke="#C8B89A" stroke-width="1.2" />
      <path d="M4 16 C8 28, 36 28, 40 18 C28 21, 14 21, 4 16 Z" fill="#E9DEC6" stroke="#C8B89A" stroke-width="1.2" />
    </g>
    <g transform="translate(120, 82) rotate(8)">
      <ellipse cx="22" cy="16" rx="21" ry="13" fill="#689B4B" />
      <path d="M3 15 C6 2, 38 2, 41 13 C28 10, 14 10, 3 15 Z" fill="#F6EFE0" stroke="#C8B89A" stroke-width="1.2" />
      <path d="M3 17 C8 29, 36 29, 41 19 C28 22, 14 22, 3 17 Z" fill="#EBE0C9" stroke="#C8B89A" stroke-width="1.2" />
    </g>
    <g transform="translate(162, 88) rotate(-6)">
      <ellipse cx="22" cy="16" rx="20" ry="12" fill="#5A8A3E" />
      <path d="M4 16 C6 3, 38 3, 40 14 C28 11, 14 11, 4 16 Z" fill="#F4EAD5" stroke="#C8B89A" stroke-width="1.2" />
      <path d="M4 16 C8 28, 36 28, 40 18 C28 21, 14 21, 4 16 Z" fill="#E9DEC6" stroke="#C8B89A" stroke-width="1.2" />
    </g>
    <g transform="translate(98, 98) rotate(14)">
      <ellipse cx="22" cy="16" rx="20" ry="12" fill="#689B4B" />
      <path d="M4 16 C6 3, 38 3, 40 14 C28 11, 14 11, 4 16 Z" fill="#F6EFE0" stroke="#C8B89A" stroke-width="1.2" />
      <path d="M4 16 C8 28, 36 28, 40 18 C28 21, 14 21, 4 16 Z" fill="#E9DEC6" stroke="#C8B89A" stroke-width="1.2" />
    </g>
    <g transform="translate(144, 98) rotate(-15)">
      <ellipse cx="22" cy="16" rx="20" ry="12" fill="#639647" />
      <path d="M4 16 C6 3, 38 3, 40 14 C28 11, 14 11, 4 16 Z" fill="#F4EAD5" stroke="#C8B89A" stroke-width="1.2" />
      <path d="M4 16 C8 28, 36 28, 40 18 C28 21, 14 21, 4 16 Z" fill="#E9DEC6" stroke="#C8B89A" stroke-width="1.2" />
    </g>

    <!-- Handcrafted Glazed Turquoise Ceramic Bowl Body -->
    <path d="M26 112 C32 184, 78 210, 142 210 C206 210, 252 184, 258 112 Z" fill="url(#turquoiseBowl)" stroke="url(#brassLid)" stroke-width="2.2" />
    <path d="M48 144 Q142 164 236 144" fill="none" stroke="#F8F4EC" stroke-opacity="0.45" stroke-width="1.5" />
    <rect x="96" y="208" width="92" height="10" rx="4" fill="url(#brassLid)" />

    <!-- Foreground Loose Pistachios on Walnut Wood Table -->
    <g transform="translate(-26, 194) rotate(-8)">
      <ellipse cx="20" cy="14" rx="18" ry="11" fill="#689B4B" />
      <path d="M3 14 C6 3, 34 3, 37 12 C26 9, 12 9, 3 14 Z" fill="#F6EFE0" stroke="#C8B89A" stroke-width="1.2" />
      <path d="M3 15 C7 25, 33 25, 37 16 C26 19, 12 19, 3 15 Z" fill="#E9DEC6" stroke="#C8B89A" stroke-width="1.2" />
    </g>
    <g transform="translate(24, 204) rotate(19)">
      <ellipse cx="20" cy="14" rx="18" ry="11" fill="#5D8C42" />
      <path d="M3 14 C6 3, 34 3, 37 12 C26 9, 12 9, 3 14 Z" fill="#F4EAD5" stroke="#C8B89A" stroke-width="1.2" />
      <path d="M3 15 C7 25, 33 25, 37 16 C26 19, 12 19, 3 15 Z" fill="#E9DEC6" stroke="#C8B89A" stroke-width="1.2" />
    </g>
  </g>
</svg>
