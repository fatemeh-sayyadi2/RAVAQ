<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 84" width="220" height="84" fill="none" role="img" aria-label="رواق">
  <!--
    Original Custom Sculpted Vector Persian Wordmark: رواق (Right-to-Left: ر · و · ا · ق)
    Independent of any system font. Crafted with modulated calligraphic contours and diamond dots.
  -->
  <g fill="#292624">
    <!-- ۱. حرف «ر» (Rightmost letter: x=204 -> 164) -->
    <path
      d="M196.5 23.5L204 28.2C204.2 38.5 201.4 47.4 194.2 54.4C186.8 61.5 176.5 65.8 164.5 67.2L163.2 63.8C172.8 61.2 181.2 56.8 187.4 50.2C193.2 44.1 196.2 35.6 196.5 23.5Z"
    />

    <!-- ۲. حرف «و» (Second letter from right: x=162 -> 118, with sculpted counter eye) -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M149.5 22.5C157.2 22.5 162.5 28.2 162.5 36.8C162.5 46.2 158.4 53.8 150.2 59.8C142.4 65.5 131.8 67.8 119.5 67.2L118.8 63.8C128.8 63.2 137.5 59.8 144.2 54.2C149.4 49.8 152.8 44.8 153.8 39.2C151.6 40.8 148.8 41.6 145.6 41.6C138.8 41.6 134.2 37.2 134.2 31.4C134.2 25.8 139.8 22.5 149.5 22.5ZM148.2 28.2C143.6 28.2 141.2 29.8 141.2 32.2C141.2 34.6 143.6 36.2 147.4 36.2C151.2 36.2 154.2 34.4 154.2 31.8C154.2 29.5 151.8 28.2 148.2 28.2Z"
    />

    <!-- ۳. حرف «ا» (Third letter from right: Architectural vertical column x=113 -> 104) -->
    <path
      d="M113 10.5L104.2 15.2V48.5C104.2 51.2 105.8 52.8 108.6 52.8H113V10.5Z"
    />

    <!-- ۴. حرف «ق» (Leftmost letter: Head loop x=68..93, deep sweeping bowl x=93 -> 14, and two diamond dots) -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M80.5 22.5C88.2 22.5 93.2 27.8 93.2 36.2V46.8C93.2 60.8 79.4 70.5 54.5 70.5C31.2 70.5 16.5 61.2 16.5 46.5C16.5 40.8 18.4 35.6 22.2 31.2L25.8 33.4C23.6 37.2 22.8 41.2 23.2 45.2C24.2 55.8 36.6 62.5 55.2 62.5C74.2 62.5 85.2 55.4 85.2 44.6V39.2C82.8 40.8 79.8 41.6 76.5 41.6C69.8 41.6 65.2 37.2 65.2 31.4C65.2 25.8 70.8 22.5 80.5 22.5ZM79.2 28.2C74.6 28.2 72.2 29.8 72.2 32.2C72.2 34.6 74.6 36.2 78.4 36.2C82.2 36.2 85.2 34.4 85.2 31.8C85.2 29.5 82.8 28.2 79.2 28.2Z"
    />
  </g>

  <!-- دو نقطه لوزی حرف «ق» (Two accurate diamond dots above Qaf) -->
  <path d="M73.5 7.5L79 13L73.5 18.5L68 13L73.5 7.5Z" fill="#2D8C88" />
  <path d="M86.5 7.5L92 13L86.5 18.5L81 13L86.5 7.5Z" fill="#B89A62" />
</svg>
